<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday!</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #f43f5e;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      overflow-x: hidden;
    }

    /* Tap to Play Overlay */
    #audio-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      transition: opacity 0.5s ease;
    }

    #audio-overlay h2 {
      font-size: 1.8rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    .play-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(244, 63, 94, 0.5);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Header Styling */
    header {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    header p {
      font-size: 1rem;
      color: var(--subtext);
    }

    /* Audio Banner */
    .audio-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .audio-container p {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }

    audio {
      width: 100%;
      border-radius: 8px;
    }

    /* Media Feed */
    .feed {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .card img, .card video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .card-caption {
      padding: 14px 16px;
      font-size: 0.95rem;
      color: var(--subtext);
    }

    /* Confetti Button */
    .confetti-btn {
      margin-top: 32px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }
  </style>
</head>
<body>

  <!-- Tap to Play Audio Overlay -->
  <div id="audio-overlay">
    <h2>A surprise is waiting for you 🎁</h2>
    <button class="play-btn" onclick="startSurprise()">Tap to Open ✨</button>
  </div>

  <header>
    <h1>Happy Birthday! 🎉</h1>
    <p>To someone truly special</p>
  </header>

  <!-- Audio Player -->
  <div class="audio-container">
    <p>🎵 Khalid — Better</p>
    <audio id="bg-music" controls loop preload="auto">
      <source src="Better.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
  </div>

  <!-- Media Gallery Feed -->
  <div class="feed">

    <!-- Photo 1 -->
    <div class="card">
      <img src="photo1.jpg" alt="Birthday Memory 1" />
      <div class="card-caption">Best moments with you ✨</div>
    </div>

    <!-- Video -->
    <div class="card">
      <video controls playsinline preload="metadata">
        <source src="video.mp4" type="video/mp4" />
        Your browser does not support video playback.
      </video>
      <div class="card-caption">Press play for a memory 🎥</div>
    </div>

  </div>

  <!-- Re-trigger Confetti Button -->
  <button class="confetti-btn" onclick="triggerConfetti()">Celebrate Again! 🎊</button>

  <script>
    function triggerConfetti() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    function startSurprise() {
      const audio = document.getElementById('bg-music');
      const overlay = document.getElementById('audio-overlay');
      
      // Play audio on user tap
      audio.play().catch(e => console.log("Audio play error:", e));
      
      // Trigger confetti
      triggerConfetti();

      // Fade out overlay screen
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 500);
    }
  </script>
</body>
</html>
